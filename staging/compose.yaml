name: kingline-staging
x-common: &common
  image: kingline-staging:20261022
  build: .
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/data
    - ./logs:/logs
    - ./run:/run/kingline
    - ./secrets/remna.token:/run/secrets/remna.token:ro
  networks: [remnawave-network]
  read_only: true
  tmpfs: ['/tmp:size=32m,noexec,nosuid']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  api:
    <<: *common
    command: [python, /app/site/backend/staging_server.py]
    ports: ['127.0.0.1:8788:8788']
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./run:/run/kingline
      - ./secrets/remna.token:/run/secrets/remna.token:ro
      - /run/kingline-site-admin:/run/site-admin:ro
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8788/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      remnawave-network:
        aliases: [kingline-staging-api]
  bot:
    <<: *common
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./run:/run/kingline
      - ./secrets/remna.token:/run/secrets/remna.token:ro
      - /run/kingline-node-review:/run/node-review:ro
    command: [python, staging_main.py]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import os,time;assert time.time()-os.stat('/run/kingline/bot-heartbeat').st_mtime<180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
networks:
  remnawave-network: {external: true}
